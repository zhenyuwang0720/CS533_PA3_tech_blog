<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <title>{{ page.title | default: site.title | escape }} · {{ site.title | escape }}</title>
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
<header class="site-header"><div class="wrap header-inner">
  <a class="brand" href="{{ '/' | relative_url }}">&lt;/&gt; {{ site.title }}</a>
  <nav><a href="{{ '/' | relative_url }}">Home</a><a href="{{ '/articles/' | relative_url }}">Articles</a><a href="{{ '/notebooks/' | relative_url }}">Notebooks</a><a href="{{ '/about/' | relative_url }}">About</a></nav>
</div></header>
<main class="wrap">{{ content }}</main>
<footer><div class="wrap">Built with GitHub Pages · <a href="https://github.com/{{ site.github_username }}/{{ site.repository_name }}">View source on GitHub</a></div></footer>
</body></html>
